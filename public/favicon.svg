<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Circular Stupa Crest (Madhya Pradesh Shasan 24-spoke Crest) -->
  <circle cx="32" cy="32" r="30" fill="url(#mpGold)" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="27" fill="#881337"/>
  <circle cx="32" cy="32" r="25" fill="#ffffff"/>

  <!-- Tricolor Inner Ring -->
  <circle cx="32" cy="32" r="23" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5"/>

  <!-- Wheat / Rice Stalks (Left & Right) -->
  <!-- Left stalk -->
  <path d="M19 40 C17 33, 17 25, 23 20" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="18" cy="36" r="1.5" fill="#b45309"/>
  <circle cx="17.5" cy="31" r="1.5" fill="#b45309"/>
  <circle cx="18.5" cy="26" r="1.5" fill="#b45309"/>
  <circle cx="21" cy="22" r="1.5" fill="#b45309"/>

  <!-- Right stalk -->
  <path d="M45 40 C47 33, 47 25, 41 20" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="46" cy="36" r="1.5" fill="#b45309"/>
  <circle cx="46.5" cy="31" r="1.5" fill="#b45309"/>
  <circle cx="45.5" cy="26" r="1.5" fill="#b45309"/>
  <circle cx="43" cy="22" r="1.5" fill="#b45309"/>

  <!-- Banyan Tree Canopy (वटवृक्ष) Background -->
  <path d="M26 32 C23 26, 26 21, 32 20 C38 21, 41 26, 38 32 Z" fill="#047857" opacity="0.85"/>
  <rect x="30.5" y="30" width="3" height="9" fill="#78350f" rx="1"/>

  <!-- Ashoka Lion Capital (Simha Stambha) Silhouette -->
  <!-- Base Abacus -->
  <rect x="25" y="38" width="14" height="2.5" fill="#1e293b" rx="0.5"/>
  <rect x="23" y="40.5" width="18" height="2" fill="#0f172a" rx="0.5"/>

  <!-- Central Lion -->
  <path d="M29 24 C29 22.5, 30.5 21, 32 21 C33.5 21, 35 22.5, 35 24 C35.5 25, 35 27, 34 29 L30 29 C29 27, 28.5 25, 29 24 Z" fill="#1e293b"/>
  <!-- Left Lion -->
  <path d="M26 25 C25 24, 25 22, 27 22 C28.5 22, 29 23.5, 29 25 L28 29 L26 28 Z" fill="#334155"/>
  <!-- Right Lion -->
  <path d="M38 25 C39 24, 39 22, 37 22 C35.5 22, 35 23.5, 35 25 L36 29 L38 28 Z" fill="#334155"/>

  <!-- Ashoka Chakra Base Center Wheel -->
  <circle cx="32" cy="39.2" r="1.8" fill="#1e3a8a"/>
  <circle cx="32" cy="39.2" r="0.8" fill="#ffffff"/>

  <!-- Top Ashoka Crown accent -->
  <polygon points="32,19 33.5,21 30.5,21" fill="#ea580c"/>

  <!-- Bottom Tricolor Strip -->
  <path d="M20 48 L44 48 L42 51 L22 51 Z" fill="#138808"/>
  <path d="M21 46.5 L43 46.5 L43.5 48 L20.5 48 Z" fill="#ffffff"/>
  <path d="M22 45 L42 45 L42.5 46.5 L21.5 46.5 Z" fill="#ff9933"/>
</svg>